name: Release VKarmani Desktop

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vkarmani-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  build-windows:
    name: Build Windows release with updater artifacts
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    permissions:
      contents: write
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.23.3'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $tokens = $null
          foreach ($file in Get-ChildItem .\scripts -File | Where-Object Extension -in '.ps1', '.psm1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell syntax check failed for $($file.FullName)"
            }
            Write-Host "[ps-check] OK: $($file.Name)"
          }

      # Bundle the reviewed checked-in resource set. The original
      # fetch-xray-windows.ps1 remains unchanged and is not run implicitly:
      # CORE-FETCH-INTEGRATION = BLOCKED_BY_POLICY. Validation module is not
      # a replacement download/publication pipeline.

      - name: Verify bundled Xray binary on Windows
        shell: pwsh
        run: .\scripts\verify-xray-windows.ps1

      - name: Verify bundled Xray manifest cross-platform
        run: node scripts/verify-core-manifest.mjs

      - name: Verify Hysteria2 schema on bundled Xray
        shell: pwsh
        run: .\scripts\verify-hysteria2-bundled-xray.ps1

      - name: Force public npm registry
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm config set registry https://registry.npmjs.org/
          npm config set fund false
          npm config get registry

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.94.0'
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Run all frontend tests and build
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm test
          npm run build

      - name: Run Rust unit tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo tree --locked --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          # Isolate timing-sensitive native fixtures on the shared CI runner.
          # Concurrency cases still create their own threads/processes.
          cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1
          # Disposable CI runner only: never opens a socket on the owner's PC.
          cargo test --locked --manifest-path src-tauri/Cargo.toml listener_owner::tests::windows_socket_owner_integration -- --ignored --exact --test-threads=1
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Windows runtime smoke checks
        shell: pwsh
        run: .\scripts\windows-runtime-smoke.ps1 -RequireCleanDisconnect

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        run: node scripts/verify-cargo-audit-windows.mjs

      - name: Verify updater config
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run verify:updater
        env:
          GITHUB_ACTIONS: 'true'
          REQUIRE_UPDATER_SIGNING_KEY: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build and publish Tauri release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@2d3036b306d86c3198f05a460dcd23cf55ef41b9 # v0.5.23
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: VKarmani Desktop ${{ github.ref_name }}
          releaseBody: |
            # 🚀 VKarmani Desktop v0.13.86 — большое обновление!

            Привет! 👋

            За последние сборки мы проделали большую работу над VKarmani Desktop: подключением, Xray, режимами Proxy и TUN, подписками и сохранностью данных. В этом выпуске собрали актуальные исправления в один пакет — с привычным интерфейсом и без замены VPN-ядра.

            Рассказываем, что изменилось! 💙

            ## 🛡️ VPN, Proxy и TUN

            - ✅ Вернули выборочный TUN в обычную сборку: больше не нужен локальный тестовый BAT.
            - ✅ Доступны все три режима: «Все приложения», «Только выбранные через VPN» и «Все, кроме исключённых» с DIRECT-правилами.
            - ✅ Для новых настроек выбран режим отдельных приложений. Прежний режим, правила и исключения сохраняются; пустой список выбранных VPN-приложений даёт понятный отказ.
            - ✅ Сохранили различие полного пути и имени `.exe`, проверку конфликтов и ограничения служб Windows. Службы общего процесса нельзя направить отдельно как весь `svchost.exe`.
            - ✅ Исправили собственный конфликт файловых дескрипторов, вызывавший `Owned routes / os error 32` при сохранении журнала маршрутов.
            - ✅ Сообщения восстановления теперь различают отказ до создания маршрутов, подтверждённую очистку, незавершённую запись журнала и неподтверждённый rollback.
            - ✅ Доработали проверку готовности Proxy и восстановление прежних настроек, включая PAC. Ошибка чтения больше не считается успешным отключением.

            VKarmani управляет своими процессами и маршрутами. Чужой открытый порт не считается готовым Xray, а чужие маршруты не используются для автоматической очистки.

            ## 🌍 Серверы и подписки Remnawave

            - ✅ Привязали каталог серверов и отложенные ответы к конкретной подписке: данные прежнего входа не должны заменять новый профиль.
            - ✅ Вход подтверждается после успешного сохранения ключа и native-сессии. При выходе учитываем фактическое подтверждение отзыва устройства.
            - ✅ Сохраняем исходные Xray JSON-графы: несколько серверов, Auto, balancers и цепочки outbounds.
            - ✅ Исправили совместимость поддерживаемых постоянных диапазонов `lengths/delays` с Xray 26.4.25. Преобразование выполняется при подготовке runtime, не меняя исходный профиль, REALITY или маскировку.
            - ✅ Неподдерживаемые диапазоны и противоречивые параметры дают ошибку вместо молчаливого удаления fragment.

            Существующие транспорты сохранены. Это обновление не подменяет настройки провайдера и не меняет домены подписок.

            ## ⚡ Стабильность и работа Xray-core

            - ✅ Перед готовностью соединения проверяем живой собственный Xray и владельца нужных локальных портов.
            - ✅ Доработали обработку отмены, конкурентных подключений и завершения Xray во время запуска.
            - ✅ Отбрасываем устаревшие результаты проверки соединения после смены подписки или поколения runtime.
            - ✅ Сохраняем сведения для восстановления при частичной ошибке подключения. Неизвестное состояние не выдаётся за успешный cleanup.
            - ✅ Перечень служб Windows запрашивается штатным SCM с правами чтения, без старого медленного WMI-запроса.

            Открытый listener или успешный HTTP-ответ не объявляются доказательством правильной маршрутизации всех TCP/UDP/DNS-потоков.

            ## 📶 Пинг и выбор серверов

            Пинг и обновление каталога сохраняют привязку к запрошенным серверам. Запоздавшие результаты не должны подменять актуальное состояние или выбранное подключение. Выбор сервера, избранное и отображение задержки остались привычными.

            ## 💾 Настройки и сохранность данных

            - ✅ Доработали атомарное сохранение защищённого DPAPI v2-состояния и восстановление подтверждённой резервной копии.
            - ✅ Повреждённое или неизвестное состояние не заменяется пустыми настройками. Ошибка восстановления при запуске блокирует автоматические действия, пока данные не подтверждены.
            - ✅ Проверили блокировки файлов, конкурентные записи, ошибки доступа и повторное открытие синтетических данных.
            - ✅ Сохранили подписку, серверы, избранное, режимы и правила. Схема DPAPI не менялась ради номера версии.

            При ошибке лучше показать понятную причину, чем незаметно потерять пользовательские данные.

            ## 🖥️ Интерфейс и удобство

            Убрали три лишних информационных блока TUN и сохранили управление режимами в окне «Приложения и службы». Цвета, оформление и остальные элементы не меняли. Проверили русскую и английскую версии при 940×620 и 1000×670; в минимальном окне нижние действия доступны через существующую прокрутку.

            ## 🔄 Обновления и установка

            Сохранили GitHub Releases и прежний ключ Tauri Updater. Перед передачей управления установщику клиент требует завершённого сохранения данных и подтверждённой очистки собственных сетевых изменений. Незавершённый журнал откладывает установку.

            Для выпуска проверяются версии, x64-установщики, контрольные суммы, обе подписи обновлений и полный исходный архив из точного релизного коммита.

            ## 🔧 Что ещё проверили

            В пакет вошли регрессионные проверки frontend/Rust, журналов, ownership, восстановления данных и конфигураций закреплённого Xray. Стандартный release-бинарник отдельно проверяет допуск трёх TUN-режимов без запуска WebView, чтения пользовательского хранилища или изменения сети. Тестовые данные обезличены; локальный BAT и приватные файлы в релиз не входят.

            ## 📦 Как обновиться

            1. Отключите VKarmani и дождитесь завершения отключения и сохранения настроек.
            2. Закройте приложение и сохраните полную резервную копию его данных под тем же Windows-пользователем, включая DPAPI, а также установщик предыдущей версии.
            3. Используйте встроенную кнопку обновления либо установщик из этого релиза. При ручной установке сохраняйте прежний тип NSIS/MSI.
            4. После запуска проверьте версию, подписку, серверы, избранное, выбранный режим и правила.

            Платформа — **Windows 10/11 x64**. TUN требует прав администратора и использует IPv4. MSI ProductVersion — **0.13.86.0**, выше 0.13.85.0; фактическое обновление установленной копии проверяется владельцем.

            ## ⚠️ Важная информация

            Выборочный TUN основан на определении процессов Xray. При недоступном, защищённом или быстро завершившемся процессе lookup может не сработать, и поток попадёт под запасное правило. Общая служба Windows DNS Client также не всегда позволяет определить исходное приложение. Это обычный process-based split tunneling, **не строгая системная изоляция и не гарантия отсутствия прямых соединений во всех ситуациях**.

            Владелец подтвердил работу экспериментальной локальной сборки в своих сценариях на реальной Windows и разрешил production-интеграцию. Это пользовательская приёмка, а не независимый пакетный аудит. Новая установленная кнопка обновления, полный независимый TCP/UDP/DNS-аудит, native rollback и многосуточный soak не объявляются прошедшими проверку.

            Kill Switch и Strict Isolation не заявлены. Если недопустим даже кратковременный обход VPN, не полагайтесь на выборочный режим как на единственную защиту.

            Подписи Tauri Updater не заменяют Windows Authenticode. Доверенная Authenticode-подпись приложения и установщиков не настроена; Windows может показать предупреждение о неизвестном издателе. Прошлый Stable 0.13.85 и его файлы сохранены для восстановления. Не удаляйте DPAPI-журналы и не сбрасывайте сеть ради отката.

            ## 💙 Спасибо!

            Спасибо за реальные проверки на Windows и подробные сообщения об ошибках. Благодаря им удалось воспроизвести конфликт журнала маршрутов и довести исправление до этого выпуска.

            **VKarmani развивается дальше. Спасибо, что вы с нами! 🚀**
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Verify production TUN admission in the built release binary
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $exe = (Resolve-Path src-tauri/target/release/vkarmani-desktop.exe).Path
          $stdout = Join-Path $env:RUNNER_TEMP 'vkarmani-production-tun.json'
          $stderr = Join-Path $env:RUNNER_TEMP 'vkarmani-production-tun.stderr'
          $probe = Start-Process -FilePath $exe -ArgumentList '--verify-production-tun' -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if ($probe.ExitCode -ne 0) { throw "Production TUN admission probe failed: $($probe.ExitCode)" }
          $result = Get-Content -LiteralPath $stdout -Raw | ConvertFrom-Json
          $version = '${{ github.ref_name }}' -replace '^v', ''
          if ($result.status -ne 'PASS' -or $result.version -ne $version -or $result.identifier -ne 'com.vkarmani.desktop' -or $result.debugAssertions -or $result.localTest -or $result.networkMutated -or $result.policyCases -ne 13 -or -not $result.invalidModeAndUnknownServiceRejected) { throw 'Production TUN binary/config contract mismatch' }
          Get-Content -LiteralPath $stdout

  validate-windows:
    name: Locked Windows validation without publishing
    if: github.event_name == 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          lfs: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.23.3'
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.94.0'
          components: rustfmt, clippy
      - name: Frontend gates
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm audit --audit-level=high
          npm test
          npm run build
          npm run verify:updater
      - name: Locked Rust gates
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo tree --locked --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml listener_owner::tests::windows_socket_owner_integration -- --ignored --exact --test-threads=1
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Resource helper tests and read-only smoke
        shell: pwsh
        run: |
          .\scripts\test-core-resource-tools.ps1
          .\scripts\windows-runtime-smoke.ps1 -RequireCleanDisconnect
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Strict Windows Rust dependency audit
        run: node scripts/verify-cargo-audit-windows.mjs
