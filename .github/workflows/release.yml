name: Release VKarmani Desktop

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vkarmani-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  build-windows:
    name: Build Windows release with updater artifacts
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    permissions:
      contents: write
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.23.3'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $tokens = $null
          foreach ($file in Get-ChildItem .\scripts -File | Where-Object Extension -in '.ps1', '.psm1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell syntax check failed for $($file.FullName)"
            }
            Write-Host "[ps-check] OK: $($file.Name)"
          }

      # Bundle the reviewed checked-in resource set. The original
      # fetch-xray-windows.ps1 remains unchanged and is not run implicitly:
      # CORE-FETCH-INTEGRATION = BLOCKED_BY_POLICY. Validation module is not
      # a replacement download/publication pipeline.

      - name: Verify bundled Xray binary on Windows
        shell: pwsh
        run: .\scripts\verify-xray-windows.ps1

      - name: Verify bundled Xray manifest cross-platform
        run: node scripts/verify-core-manifest.mjs

      - name: Verify Hysteria2 schema on bundled Xray
        shell: pwsh
        run: .\scripts\verify-hysteria2-bundled-xray.ps1

      - name: Force public npm registry
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm config set registry https://registry.npmjs.org/
          npm config set fund false
          npm config get registry

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.94.0'
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Run all frontend tests and build
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm test
          npm run build

      - name: Run Rust unit tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo tree --locked --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          # Isolate timing-sensitive native fixtures on the shared CI runner.
          # Concurrency cases still create their own threads/processes.
          cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1
          # Disposable CI runner only: never opens a socket on the owner's PC.
          cargo test --locked --manifest-path src-tauri/Cargo.toml listener_owner::tests::windows_socket_owner_integration -- --ignored --exact --test-threads=1
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Windows runtime smoke checks
        shell: pwsh
        run: .\scripts\windows-runtime-smoke.ps1 -RequireCleanDisconnect

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        run: node scripts/verify-cargo-audit-windows.mjs

      - name: Verify updater config
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run verify:updater
        env:
          GITHUB_ACTIONS: 'true'
          REQUIRE_UPDATER_SIGNING_KEY: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build and publish Tauri release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@2d3036b306d86c3198f05a460dcd23cf55ef41b9 # v0.5.23
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: VKarmani Desktop ${{ github.ref_name }}
          releaseBody: |
            ## VKarmani Desktop 0.13.84 Stable

            Этот выпуск публикуется по решению владельца после технических проверок. Нативные установка, чтение рабочей AppData, встроенная кнопка обновления, Proxy/Full TUN/DNS/egress и длительная работа на Windows 11 остаются NOT_RUN / OWNER_ACCEPTANCE_PENDING. CI не заменяет эти испытания; MASTER v2 остаётся активным.

            ### Исправления

            - Сохранность данных: guarded IO журналов Proxy/routes и DPAPI v2, отказ от перезаписи при ошибке чтения, согласованная загрузка настроек/правил/избранного; восстановление только после подтверждения точной резервной копии. Native схема и DPAPI v1/v2 архитектура сохранены.
            - Авторизация: подтверждение сохранения ключа и native session для точной подписки до входа; каталог и cache привязаны к подписке, поздние ответы другой сессии отбрасываются. Logout требует подтверждённого revoke до удаления ключа/каталога.
            - Xray lifecycle: проверки владельца TCP-listener и живого retained child, повторные проверки перед публикацией подключения/restart и отмена конкурирующих операций. Чужой Xray и занятые им порты не освобождаются автоматически. Listener не доказывает VPN-связность.
            - Proxy: включение только при подтверждённом runtime/listener ownership; ошибка readback не превращается в выдуманное «выключен». Восстановление возвращает прежние Proxy/PAC settings и сохраняет journal при неподтверждённой очистке.
            - TUN: точное route/LUID ownership, сохранение чужих маршрутов, rollback частичной настройки и TUN-free preflight; различение причин DNS ошибок без массового изменения Windows DNS/routes/firewall.
            - Асинхронное состояние: задержанные ответы login/bootstrap/probe не пересекают logout/recovery/новую подписку и не перезаписывают более новую проверку. Native HTTP probe привязан к тому же запуску Xray до/после HTTP; текущая ошибка убирает старое OK.
            - Уточнены флаги/страны, отдельные сообщения и обработка ошибок UI; существующий внешний вид сохранён.

            ### Обновление и ограничения

            - Дополнительное исправление после RC4: installer handoff отказывает даже при idle/noPID, если Proxy/route ownership не подтверждает полную очистку. Проверка выполняется после download/flush под lease; journal/настройки сети не очищаются автоматически, а чужой enabled Proxy без журнала VKarmani не блокирует установку.
            - Tauri Updater сохраняет прежние public key и production endpoint. latest.json указывает на подписанный NSIS этого отдельного релиза v0.13.84. Техническая доставка и подписи проверяются отдельно от фактической кнопки в установленной копии.
            - Перед обновлением из0.13.83 вручную отключить только собственную сессию VKarmani, подтвердить idle/cleanup, дождаться сохранения и сделать приватный полный backup в том же Windows профиле. Не останавливать Happ/чужой Xray и не менять Windows networking. Затем «Проверить обновление» → «Установить обновление»; после запуска проверить данные и версию. При неизвестном ownership/ошибке — STOP без reset.
            - Selected-app/service routing и активные process DIRECT exceptions временно заблокированы по соображениям безопасности. Правила сохраняются. Strict Isolation и Kill Switch не реализованы; недоказанные защитные функции не включены.
            - Full TUN и DNS leak protection требуют реальной приёмки. Исторические DNS leaks, native startup crash, внешний os error32, TCP/UDP timeouts и длительная стабильность не объявляются полностью исправленными.
            - Полная поддержка Windows7/Linux не заявляется. История соединений, расширенная Diagnostics и другие некритические требования остаются в MASTER v2.
            - Windows Authenticode отсутствует. Подписи Tauri Updater создаются прежним CI-ключом и не заменяют Authenticode.
            - MSI ProductVersion0.13.84.0 выше исходного Stable083/0.13.83.0; UpgradeCode/product identity сохраняются. У RC1–RC4 уже0.13.84.0: RC-MSI→Stable-MSI same-version upgrade NOT_RUN, не применять force/reinstall или NSIS поверх MSI. Ручной путь требует согласованного типа установщика; native MSI/NSIS приёмка остаётся владельцу.
            - Stable0.13.83 и Draft RC1–RC4 с их тегами/артефактами сохранены для истории и rollback. При неудачном обновлении сначала подтвердить owned cleanup/закрытый app, сохранить текущее состояние отдельно, затем прежний083 installer и полный согласованный backup под тем же SID; не смешивать snapshots и не переходить на raw076/v1.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  validate-windows:
    name: Locked Windows validation without publishing
    if: github.event_name == 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          lfs: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.23.3'
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.94.0'
          components: rustfmt, clippy
      - name: Frontend gates
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm audit --audit-level=high
          npm test
          npm run build
          npm run verify:updater
      - name: Locked Rust gates
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo tree --locked --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml listener_owner::tests::windows_socket_owner_integration -- --ignored --exact --test-threads=1
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Resource helper tests and read-only smoke
        shell: pwsh
        run: |
          .\scripts\test-core-resource-tools.ps1
          .\scripts\windows-runtime-smoke.ps1 -RequireCleanDisconnect
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Strict Windows Rust dependency audit
        run: node scripts/verify-cargo-audit-windows.mjs
