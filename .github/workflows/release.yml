name: Release VKarmani Desktop

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vkarmani-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  build-windows:
    name: Build Windows release with updater artifacts
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    permissions:
      contents: write
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.23.3'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $tokens = $null
          foreach ($file in Get-ChildItem .\scripts -File | Where-Object Extension -in '.ps1', '.psm1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell syntax check failed for $($file.FullName)"
            }
            Write-Host "[ps-check] OK: $($file.Name)"
          }

      # Bundle the reviewed checked-in resource set. The original
      # fetch-xray-windows.ps1 remains unchanged and is not run implicitly:
      # CORE-FETCH-INTEGRATION = BLOCKED_BY_POLICY. Validation module is not
      # a replacement download/publication pipeline.

      - name: Verify bundled Xray binary on Windows
        shell: pwsh
        run: .\scripts\verify-xray-windows.ps1

      - name: Verify bundled Xray manifest cross-platform
        run: node scripts/verify-core-manifest.mjs

      - name: Verify Hysteria2 schema on bundled Xray
        shell: pwsh
        run: .\scripts\verify-hysteria2-bundled-xray.ps1

      - name: Force public npm registry
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm config set registry https://registry.npmjs.org/
          npm config set fund false
          npm config get registry

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.94.0'
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Run all frontend tests and build
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm test
          npm run build

      - name: Run Rust unit tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo tree --locked --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          # Isolate timing-sensitive native fixtures on the shared CI runner.
          # Concurrency cases still create their own threads/processes.
          cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1
          # Disposable CI runner only: never opens a socket on the owner's PC.
          cargo test --locked --manifest-path src-tauri/Cargo.toml listener_owner::tests::windows_socket_owner_integration -- --ignored --exact --test-threads=1
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Windows runtime smoke checks
        shell: pwsh
        run: .\scripts\windows-runtime-smoke.ps1 -RequireCleanDisconnect

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        run: node scripts/verify-cargo-audit-windows.mjs

      - name: Verify updater config
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run verify:updater
        env:
          GITHUB_ACTIONS: 'true'
          REQUIRE_UPDATER_SIGNING_KEY: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build and publish Tauri release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@2d3036b306d86c3198f05a460dcd23cf55ef41b9 # v0.5.23
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: VKarmani Desktop ${{ github.ref_name }}
          releaseBody: |
            - RC4: проверенный пакет TASK-010 после PR48–51. Мастер-ТЗ остаётся открытым; нативная Windows-приёмка установщиков, DPAPI, кнопки updater и сети NOT_RUN.
            - Включение системного Proxy требует точного владельца всех listener и живого retained child Xray; отмена повторно проверяется до транзакции. Чужие процессы и занятые порты не освобождаются автоматически.
            - Ошибка чтения Proxy больше не превращается в выдуманный статус «выключен». Восстановление сохраняет исходный Proxy/PAC, даже если он остаётся включённым; UI и логи отражают проверенное состояние. Ошибки до/после restore сохраняют recovery journal для подтверждённого повтора.
            - Нативная HTTP-проверка связи привязана к текущему Managed runtime: владелец listener и retained child проверяются до запроса, PID/start/per-launch epoch — повторно после HTTP. Во время HTTP mutex runtime не удерживается. Ответ от прежнего или чужого runtime не публикуется как успех. Это не подтверждает UDP, DNS, VPN/DIRECT или отсутствие утечек.
            - Задержанные probe/IPC-ответы и ошибки не возвращают кэш после logout/recovery, не переходят между подписками и не перезаписывают более новую проверку. UI проверяет эпоху входа/подключения. Текущая неудачная проверка убирает старый «OK»; отменённая старая не стирает новый результат.
            - Сохранены исправления RC2/RC3: guarded journal IO, DPAPI v2, подтверждённое восстановление конкретной копии, renderer safe retry, точный rollback маршрутов/LUID, TUN-free preflight, причины DNS ошибок, привязка каталога к подписке, durable key/native session ACK и подтверждённый revoke до очистки logout.
            - Native startup crash и внешний источник sharing32 остаются неизвестны. Selected apps/services и активные process DIRECT rules заблокированы; правила сохраняются. Strict Isolation/Kill Switch не реализованы. Windows10/Win7/Linux и длительная работа требуют отдельных этапов.
            - Updater сохраняет ключ доверия и production endpoint. Активное/неизвестное соединение откладывает установку. Draft не доставляется через Stable083 feed; ручной NSIS не заменяет встроенную кнопку. Отдельный test-feed сценарий подготовлен, его фактический запуск NOT_RUN.
            - Оформление, версии зависимостей и байты ядра сохранены. Windows Authenticode отсутствует; подписи Tauri Updater создаются прежним CI-ключом. MSI ProductVersion0.13.84.0 совпадает с RC1/RC2/RC3: same-version MSI upgrade NOT_RUN. Нативная приёмка выполняется владельцем по безопасному backup/rollback сценарию.
            - Только Draft/prerelease. Stable Latest0.13.83 и все исторические RC1/RC2/RC3 артефакты сохраняются. Stable promotion NO_GO до отдельной оценки актуального кандидата и необходимых подтверждений; количество PR/тестов не закрывает54требования.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  validate-windows:
    name: Locked Windows validation without publishing
    if: github.event_name == 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          lfs: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.23.3'
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.94.0'
          components: rustfmt, clippy
      - name: Frontend gates
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm audit --audit-level=high
          npm test
          npm run build
          npm run verify:updater
      - name: Locked Rust gates
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo tree --locked --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml listener_owner::tests::windows_socket_owner_integration -- --ignored --exact --test-threads=1
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Resource helper tests and read-only smoke
        shell: pwsh
        run: |
          .\scripts\test-core-resource-tools.ps1
          .\scripts\windows-runtime-smoke.ps1 -RequireCleanDisconnect
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Strict Windows Rust dependency audit
        run: node scripts/verify-cargo-audit-windows.mjs
