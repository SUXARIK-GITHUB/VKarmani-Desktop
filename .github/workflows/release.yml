name: Release VKarmani Desktop

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vkarmani-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  build-windows:
    name: Build Windows release with updater artifacts
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    permissions:
      contents: write
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.23.3'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $tokens = $null
          foreach ($file in Get-ChildItem .\scripts -File | Where-Object Extension -in '.ps1', '.psm1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell syntax check failed for $($file.FullName)"
            }
            Write-Host "[ps-check] OK: $($file.Name)"
          }

      # Bundle the reviewed checked-in resource set. The original
      # fetch-xray-windows.ps1 remains unchanged and is not run implicitly:
      # CORE-FETCH-INTEGRATION = BLOCKED_BY_POLICY. Validation module is not
      # a replacement download/publication pipeline.

      - name: Verify bundled Xray binary on Windows
        shell: pwsh
        run: .\scripts\verify-xray-windows.ps1

      - name: Verify bundled Xray manifest cross-platform
        run: node scripts/verify-core-manifest.mjs

      - name: Verify Hysteria2 schema on bundled Xray
        shell: pwsh
        run: .\scripts\verify-hysteria2-bundled-xray.ps1

      - name: Force public npm registry
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm config set registry https://registry.npmjs.org/
          npm config set fund false
          npm config get registry

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.94.0'
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Run all frontend tests and build
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm test
          npm run build

      - name: Run Rust unit tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo tree --locked --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          # Isolate timing-sensitive native fixtures on the shared CI runner.
          # Concurrency cases still create their own threads/processes.
          cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1
          # Disposable CI runner only: never opens a socket on the owner's PC.
          cargo test --locked --manifest-path src-tauri/Cargo.toml listener_owner::tests::windows_socket_owner_integration -- --ignored --exact --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml xray_config::fragment_compat_tests::windows_bundled_xray_cascade_stats -- --ignored --exact --test-threads=1
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Windows runtime smoke checks
        shell: pwsh
        run: .\scripts\windows-runtime-smoke.ps1 -RequireCleanDisconnect

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        run: node scripts/verify-cargo-audit-windows.mjs

      - name: Verify updater config
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run verify:updater
        env:
          GITHUB_ACTIONS: 'true'
          REQUIRE_UPDATER_SIGNING_KEY: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build and publish Tauri release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@2d3036b306d86c3198f05a460dcd23cf55ef41b9 # v0.5.23
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: VKarmani Desktop ${{ github.ref_name }}
          releaseBody: |
            # 🚀 VKarmani Desktop v0.13.87 — поддержка FinalMask и улучшение стабильности!

            Привет! 👋

            В этом обновлении сосредоточились на новых возможностях наших VPN-серверов и исправлении ошибок, которые обнаружились во время тестирования.

            Доработали совместимость с Xray, исправили подсчёт трафика, улучшили работу каскадных подключений и добавили более понятную диагностику ошибок.

            При этом привычный интерфейс VKarmani остался без изменений. 💙

            ### 🛡️ FinalMask и Xray-core

            - ✅ Обновили Xray-core до **v26.10.31**.
            - ✅ Сохраняем порядок TCP- и UDP-масок, настройки QUIC и исходные последовательности фрагментации.
            - ✅ Улучшили работу с последовательностями фрагментации и маскировкой трафика.
            - ✅ Исправили проблемы совместимости с новыми Xray JSON-профилями.
            - ✅ Сохранили оригинальные параметры серверов без произвольного упрощения конфигураций.

            В автоматических проверках прошли как прежние, так и новые форматы профилей.

            ### 🕸️ REALITY и spiderX

            - ✅ Улучшили обработку REALITY `spiderX`.
            - ✅ Сохранили индивидуальные параметры для каждого сервера.
            - ✅ Добавили корректную совместимость с профилями, использующими FinalMask и spiderX одновременно.
            - ✅ Сохранили поддержку обычных REALITY-подключений без этих параметров.

            ### 📊 Исправили отображение трафика

            Раньше в некоторых подключениях счётчики могли постоянно показывать `0 Б`, хотя соединение использовалось.

            - ✅ Исправили получение статистики Xray для сложных профилей.
            - ✅ Доработали подсчёт входящего и исходящего трафика.
            - ✅ Улучшили обработку отсутствующих показаний, чтобы не отображать выдуманные значения.
            - ✅ Добавили проверки передачи реальных данных через тестовую цепочку Xray.

            ### 🌍 Улучшили работу каскадных серверов

            - ✅ Исправили совместимость некоторых старых цепочек подключения с новой версией Xray.
            - ✅ Переносим совместимые цепочки из старого `proxySettings` в `dialerProxy`, сохраняя исходные параметры профиля.
            - ✅ Улучшили определение внешнего IP.
            - ✅ Исправили ситуацию, когда устаревший результат проверки мог показывать IP предыдущего сервера.
            - ✅ Сохранили поддержку обычных серверов и Auto-профилей.

            ### ⚡ Стабильность и диагностика

            - ✅ Улучшили диагностику запуска Xray.
            - ✅ Добавили более подробную информацию о готовности локальных портов.
            - ✅ При таймауте запуска показываем состояние локальных портов и PID процесса, который их занял.
            - ✅ Расширили автоматические проверки конфигураций и работы Xray.
            - ✅ Сохранили существующую логику подключения, отключения и восстановления после ошибок.

            ### 🖥️ Интерфейс

            В этот раз решили не менять внешний вид приложения.

            Все привычные кнопки, вкладки, настройки, серверы и режимы подключения остались на своих местах.

            Обновление посвящено совместимости и стабильности — без лишних визуальных изменений.

            ### 📦 Как обновиться

            Отключите VPN и дождитесь завершения соединения. Рекомендуем сохранить резервную копию данных приложения, затем воспользоваться встроенной проверкой обновлений или скачать установщик из этого релиза.

            При ручном обновлении используйте прежний тип установщика (NSIS или MSI). MSI имеет ProductVersion `0.13.87.0`. Если установлена предварительная сборка MSI с тем же номером, не форсируйте обновление поверх неё. Установщики проверены подписями Tauri Updater. Подписи Windows Authenticode у них нет.

            **Поддерживаемая платформа** — Windows 10/11 x64. Для TUN нужны права администратора.

            Владелец проверил тестовую сборку на Windows в своих сценариях. Автоматические проверки охватывают конфигурации Proxy и трёх режимов TUN и передачу данных через синтетическую цепочку Xray. Релиз не заявляет независимый аудит сетевой изоляции или утечек.

            ### 💙 Спасибо за поддержку!

            Спасибо всем, кто тестирует VKarmani и сообщает об ошибках.

            Именно благодаря таким проверкам мы находим проблемы, которые сложно заметить при обычной разработке, и постепенно делаем клиент лучше.

            Продолжаем работать! 🚀

          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Verify production TUN admission in the built release binary
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $exe = (Resolve-Path src-tauri/target/release/vkarmani-desktop.exe).Path
          $stdout = Join-Path $env:RUNNER_TEMP 'vkarmani-production-tun.json'
          $stderr = Join-Path $env:RUNNER_TEMP 'vkarmani-production-tun.stderr'
          $probe = Start-Process -FilePath $exe -ArgumentList '--verify-production-tun' -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if ($probe.ExitCode -ne 0) { throw "Production TUN admission probe failed: $($probe.ExitCode)" }
          $result = Get-Content -LiteralPath $stdout -Raw | ConvertFrom-Json
          $version = '${{ github.ref_name }}' -replace '^v', ''
          if ($result.status -ne 'PASS' -or $result.version -ne $version -or $result.identifier -ne 'com.vkarmani.desktop' -or $result.debugAssertions -or $result.localTest -or $result.networkMutated -or $result.policyCases -ne 13 -or -not $result.invalidModeAndUnknownServiceRejected) { throw 'Production TUN binary/config contract mismatch' }
          Get-Content -LiteralPath $stdout

  validate-windows:
    name: Locked Windows validation without publishing
    if: github.event_name == 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          lfs: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.23.3'
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.94.0'
          components: rustfmt, clippy
      - name: Frontend gates
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm audit --audit-level=high
          npm test
          npm run build
          npm run verify:updater
      - name: Locked Rust gates
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo tree --locked --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml listener_owner::tests::windows_socket_owner_integration -- --ignored --exact --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml xray_config::fragment_compat_tests::windows_bundled_xray_cascade_stats -- --ignored --exact --test-threads=1
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Resource helper tests and read-only smoke
        shell: pwsh
        run: |
          .\scripts\test-core-resource-tools.ps1
          .\scripts\windows-runtime-smoke.ps1 -RequireCleanDisconnect
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Strict Windows Rust dependency audit
        run: node scripts/verify-cargo-audit-windows.mjs
