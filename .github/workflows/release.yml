name: Release VKarmani Desktop

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vkarmani-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  build-windows:
    name: Build Windows release with updater artifacts
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    permissions:
      contents: write
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.23.3'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $tokens = $null
          foreach ($file in Get-ChildItem .\scripts -File | Where-Object Extension -in '.ps1', '.psm1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell syntax check failed for $($file.FullName)"
            }
            Write-Host "[ps-check] OK: $($file.Name)"
          }

      # Bundle the reviewed checked-in resource set. The original
      # fetch-xray-windows.ps1 remains unchanged and is not run implicitly:
      # CORE-FETCH-INTEGRATION = BLOCKED_BY_POLICY. Validation module is not
      # a replacement download/publication pipeline.

      - name: Verify bundled Xray binary on Windows
        shell: pwsh
        run: .\scripts\verify-xray-windows.ps1

      - name: Verify bundled Xray manifest cross-platform
        run: node scripts/verify-core-manifest.mjs

      - name: Verify Hysteria2 schema on bundled Xray
        shell: pwsh
        run: .\scripts\verify-hysteria2-bundled-xray.ps1

      - name: Force public npm registry
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm config set registry https://registry.npmjs.org/
          npm config set fund false
          npm config get registry

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.94.0'
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Run all frontend tests and build
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm test
          npm run build

      - name: Run Rust unit tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo tree --locked --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          # Isolate timing-sensitive native fixtures on the shared CI runner.
          # Concurrency cases still create their own threads/processes.
          cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1
          # Disposable CI runner only: never opens a socket on the owner's PC.
          cargo test --locked --manifest-path src-tauri/Cargo.toml listener_owner::tests::windows_socket_owner_integration -- --ignored --exact --test-threads=1
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Windows runtime smoke checks
        shell: pwsh
        run: .\scripts\windows-runtime-smoke.ps1 -RequireCleanDisconnect

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        run: node scripts/verify-cargo-audit-windows.mjs

      - name: Verify updater config
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run verify:updater
        env:
          GITHUB_ACTIONS: 'true'
          REQUIRE_UPDATER_SIGNING_KEY: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build and publish Tauri release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@2d3036b306d86c3198f05a460dcd23cf55ef41b9 # v0.5.23
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: VKarmani Desktop ${{ github.ref_name }}
          releaseBody: |
            ## VKarmani Desktop 0.13.85 Stable

            Точечное обновление управления TUN. Публикуется по прямому решению владельца после технических проверок. Реальные установка/встроенная кнопка, DPAPI readback, Proxy/Full TUN/UDP/DNS/cleanup/rollback на Windows11 остаются **NOT_RUN / OWNER_ACCEPTANCE_PENDING**. MASTER v2 не завершён.

            ### Исправления

            - В «Приложения и службы» добавлен выбор «Все приложения / Только выбранные / Все, кроме исключённых», согласованный с настройками. Большое постоянное предупреждение убрано; ограничения отображаются коротко возле соответствующего режима.
            - Причина неактивной кнопки подключения теперь видна вместе с действием настройки TUN. На небольшой высоте правая TUN-область прокручивается, сохраняя доступ к подсказке и кнопкам вместо обрезания. Проверены browser fixtures940x620/1000x670 RU/EN, не nativeWebView/VPN.
            - Запрещённое переключение работающего Proxy в TUN отклоняется до изменения настройки и отключения текущего подключения.
            - Режим all с сохранёнными VPN-правилами допускается. Переход в all выполняется только явным действием пользователя. Правила, их значения и флаги сохраняются, настройки не сбрасываются.
            - Xray/Wintun, зависимости, DPAPI schema/codec, backend Proxy/routes/DNS, installer hooks, updater endpoint и public key не менялись.

            ### Ограничения

            - Selected-app/service routing и активные process DIRECT исключения остаются заблокированы. Для Full TUN выбрать «Все приложения» и при необходимости явно отключить активные DIRECT-записи их переключателями; сами записи сохраняются. Это не восстановление выбранных приложений и не WFP/privileged helper/driver implementation.
            - Full TUN, UDP, DNS leak protection и сетевая изоляция не получили native PASS. Kill Switch и Strict Isolation не реализованы. Исторические startup crash/os error32/timeouts и остальные требования не объявляются полностью исправленными.
            - Строка Xray process lookup common/net:not found без времени/runtime provenance не отнесена к текущей попытке. Неактивная кнопка сама не запускает Xray. Happ не объявляется первопричиной.
            - Windows Authenticode у приложения/установщиков отсутствует. Tauri Updater signatures проверяются прежним ключом отдельно от Authenticode.
            - MSI ProductVersion0.13.85.0 выше Stable084/0.13.84.0, но совпадает с RC1. RC1-MSI→Stable-MSI same-version upgrade NOT_RUN; не применять force/reinstall/registration cleanup или ручной NSIS поверх MSI. Сохранять согласованный тип установки.

            ### Обновление и восстановление

            Из0.13.84: подтвердить idle/cleanup только своей VKarmani, дождаться сохранения, закрыть её и сделать приватный согласованный backup всего дерева данных в том же Windows профиле/SID; сохранить прежний084 installer. Затем открыть без автоматического подключения и нажать «Проверить обновление» → убедиться в0.13.85 → «Установить обновление». После запуска проверить версию, подписку, серверы, избранное, настройки и все правила сразу и после повторного запуска. Ручная установка не заменяет испытание кнопки.

            При ошибке/неизвестном ownership — STOP: сохранить новое состояние отдельно, подтвердить own cleanup/закрытый app, использовать проверенный прежний084 installer и coherent pre-update snapshot при необходимости. Native rollback не испытан; отказ downgrade не обходить force. Не смешивать поколения данных, не делать reset AppData или raw076/v1 downgrade. Happ/чужой Xray и Windows DNS/routes/Proxy/Firewall/adapters не трогать.

            Stable0.13.84, прежние RC, их теги и файлы сохранены. Новый latest.json должен указывать на подписанный NSIS отдельного релиза v0.13.85; доставка и подписи проверяются отдельно от реальной кнопки на установленной копии.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  validate-windows:
    name: Locked Windows validation without publishing
    if: github.event_name == 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          lfs: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.23.3'
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.94.0'
          components: rustfmt, clippy
      - name: Frontend gates
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm audit --audit-level=high
          npm test
          npm run build
          npm run verify:updater
      - name: Locked Rust gates
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo tree --locked --manifest-path src-tauri/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml listener_owner::tests::windows_socket_owner_integration -- --ignored --exact --test-threads=1
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Resource helper tests and read-only smoke
        shell: pwsh
        run: |
          .\scripts\test-core-resource-tools.ps1
          .\scripts\windows-runtime-smoke.ps1 -RequireCleanDisconnect
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Strict Windows Rust dependency audit
        run: node scripts/verify-cargo-audit-windows.mjs
