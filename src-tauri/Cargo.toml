[package]
name = "vkarmani-desktop"
version = "0.13.71"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vkarmani_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "socks"] }
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-updater = "2.10.0"
tauri-plugin-single-instance = "2.0.0"
windows-sys = { version = "0.59", features = ["Win32_Networking_WinInet", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Security_Authorization", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp"] }
