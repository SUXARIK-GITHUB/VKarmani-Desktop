[package]
name = "vkarmani-desktop"
version = "0.13.64"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vkarmani_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "socks"] }
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-updater = "2.10.0"
tauri-plugin-single-instance = "2.0.0"
windows-sys = { version = "0.59", features = ["Win32_Networking_WinInet", "Win32_Security_Cryptography", "Win32_System_Memory"] }
